services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - '80:80'
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host
